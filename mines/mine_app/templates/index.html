{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh]">
    <h1 class="text-4xl font-black mb-8 text-orange-500 tracking-tighter">MINES</h1>

    <div id="game-grid" class="p-4 bg-slate-900 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="grid grid-cols-5 gap-3">
            {% for i in range %}
                <div id="tile-{{ i }}" class="w-16 h-16 bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer transition-all border-b-4 border-slate-950 active:border-b-0 active:translate-y-1">
                    <button class="w-full h-full"
                            hx-post="{% url 'reveal' i %}"
                            hx-target="#tile-{{ i }}"
                            hx-swap="outerHTML">
                    </button>
                </div>
            {% endfor %}
        </div>
    </div>

    <button hx-post="{% url 'start_game' %}" hx-target="#game-grid" class="mt-8 px-8 py-3 bg-orange-600 hover:bg-orange-500 font-bold rounded-lg shadow-lg">
        PLAY NEW GAME
    </button>
</div>
{% endblock content %}
