<div id="login-overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 w-full max-w-[340px] shadow-2xl relative">

        <button onclick="document.getElementById('login-overlay').remove()" class="absolute top-4 right-4 text-slate-500 hover:text-orange-500">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <div class="flex flex-col items-center mb-5">
            <h2 class="text-xl font-black text-white text-center tracking-tight">
                <span class="text-orange-500">MINESPRO</span>
            </h2>
            <label class="text-[10px] text-slate-500 font-bold uppercase text-center mt-0.5 tracking-widest">
                login/signup
            </label>
            <div class="w-full border-b border-slate-800/50 mt-4"></div>
        </div>

        <div id="auth-step-container">
            <!-- Step 1: Username Entry -->
            <form hx-post="{% url 'check_username' %}"
                  hx-target="#auth-step-container"
                  hx-swap="innerHTML"
                  class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase ml-1">Username</label>
                    <input type="text"
                           name="username"
                           id="username-input"
                           required
                           minlength="3"
                           maxlength="30"
                           class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 mt-1 text-white text-sm outline-none focus:ring-1 focus:ring-orange-500"
                           placeholder="Choose a username">
                </div>

                <div id="username-error" class="empty:hidden text-red-400 text-xs font-medium"></div>

                <button type="submit"
                        class="w-full bg-orange-500 py-3.5 rounded-xl font-bold text-black text-sm uppercase tracking-wide hover:bg-orange-400 transition-all active:scale-[0.98]">
                    Continue
                </button>
            </form>

            <p class="text-slate-500 text-xs text-center mt-4">
                Enter your username to continue
            </p>
        </div>
    </div>
</div>
