<nav class="bg-slate-900 border-b border-slate-800 px-4 md:px-6 py-4 flex items-center justify-between">
    <div class="flex-shrink-0">
        <a href="/" class="text-xl md:text-2xl font-black tracking-tighter text-orange-500">
            MINES<span class="text-white font-light">PRO</span>
        </a>
    </div>

    <div class="flex items-center space-x-2 md:space-x-6">
        {% if request.user.is_authenticated %}
            <!-- Wallet Button -->
            <button
                hx-get="{% url 'wallet_modal' %}"
                hx-target="body"
                hx-swap="beforeend"
                class="flex items-center bg-slate-800 px-2 py-1.5 md:px-3 rounded-lg text-white font-bold text-sm tracking-tight transition-all active:scale-95 hover:bg-slate-700">
                <span class="text-orange-500 font-bold mr-1">Rs</span>
                <span id="user-balance">{{ user.usdt_balance|floatformat:2 }}</span>
            </button>

            <!-- Logout Button -->
            <button
                hx-post="{% url 'logout' %}"
                hx-swap="none"
                class="bg-red-600/20 hover:bg-red-600/30 text-red-400 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-all active:scale-95 border border-red-600/30">
                Logout
            </button>
        {% else %}
            <!-- Login Button -->
            <button
                hx-get="{% url 'login_view' %}"
                hx-target="body"
                hx-swap="beforeend"
                class="bg-orange-500 hover:bg-orange-400 text-black px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-all active:scale-95 shadow-[0_2px_0_rgb(194,120,3)]">
                Login
            </button>
        {% endif %}
    </div>
</nav>
