        <form hx-post="{% url 'submit_withdrawal' %}" hx-target="#withdrawal-status">
            {% csrf_token %}
            <p class="text-xs text-slate-500 uppercase font-black mb-2">Withdraw Account</p>
            <input type="text"
                   name="withdrawID"
                   required
                   placeholder="Enter Account Number"
                   class="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-white mb-4 focus:border-orange-500 outline-none transition-all">

            <div id="withdrawal-status" class="mb-4"></div>

            <button type="submit" class="w-full bg-white text-black font-black py-4 rounded-xl uppercase tracking-widest hover:bg-slate-200 transition-all">
                Submit Withdrawal
            </button>
        </form>

</div>

<script>
    function updateFileName(input) {
        const fileName = input.files[0] ? input.files[0].name : "Choose image...";
        const display = document.getElementById('file-name');
        display.innerText = fileName;
        display.classList.remove('text-slate-400');
        display.classList.add('text-orange-500');
    }
</script>
