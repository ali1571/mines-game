<!-- Step 2: New User Signup -->
<form hx-post="{% url 'signup_submit' %}"
      hx-target="body"
      hx-swap="none"
      class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="username" value="{{ username }}">

    <!-- New account message -->
    <div class="bg-blue-500/10 border border-blue-500/30 rounded-xl p-3 mb-4">
        <p class="text-blue-400 text-sm font-bold text-center">
            🎉 Create your account
        </p>
        <p class="text-slate-400 text-xs text-center mt-1">
            Username: <span class="text-white font-bold">{{ username }}</span>
        </p>
    </div>

    <!-- Back button to change username -->
    <button type="button"
            hx-get="{% url 'login_view' %}"
            hx-target="#auth-step-container"
            hx-swap="innerHTML"
            class="text-slate-400 text-xs hover:text-orange-500 flex items-center gap-1 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
        Change username
    </button>

    <div>
        <label class="text-[10px] text-slate-500 font-bold uppercase ml-1">Password</label>
        <div class="relative">
            <input id="password-field"
                   type="password"
                   name="password"
                   required
                   minlength="6"
                   class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 mt-1 text-white text-sm outline-none focus:ring-1 focus:ring-orange-500 pr-10">

            <button type="button"
                    onclick="togglePasswordVisibility()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 mt-0.5 text-slate-500 hover:text-orange-500 transition-colors">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            </button>
        </div>
        <p class="text-slate-500 text-xs mt-1 ml-1">Minimum 6 characters</p>
    </div>

    <div>
        <label class="text-[10px] text-slate-500 font-bold uppercase ml-1">Confirm Password</label>
        <input type="password"
               name="password_confirm"
               required
               minlength="6"
               class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 mt-1 text-white text-sm outline-none focus:ring-1 focus:ring-orange-500">
    </div>

    <div id="auth-error" class="empty:hidden text-red-400 text-xs font-medium bg-red-500/10 border-l-4 border-red-500 px-3 py-2 rounded-r-lg"></div>

    <button type="submit"
            class="w-full bg-orange-500 py-3.5 rounded-xl font-bold text-black text-sm uppercase tracking-wide hover:bg-orange-400 transition-all active:scale-[0.98]">
        Create Account
    </button>
</form>

<script>
function togglePasswordVisibility() {
    const field = document.getElementById('password-field');
    const icon = document.getElementById('eye-icon');
    if (field.type === 'password') {
        field.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />';
    } else {
        field.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />';
    }
}
</script>
