<script src="https://cdn.tailwindcss.com"></script>
<div id="game-overlay" hx-swap-oob="true" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50">
    <form id="kyc-form"
          hx-post="{% url 'submit_kyc' %}"
          hx-encoding="multipart/form-data"
          hx-target="#game-overlay"
          class="relative bg-slate-900 p-8 rounded-2xl border border-slate-800 max-w-md w-full mx-4 space-y-4">

        <button type="button"
                id="close-kyc-modal"
                class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors text-xl">
            ✕
        </button>

        {% csrf_token %}

        <h2 class="text-xl font-bold text-orange-500 mb-4">Complete Your Profile</h2>
        <p class="text-slate-400 text-sm mb-6">First-time login detected. Please provide your details for verification to withdraw.</p>

        <div class="grid grid-cols-2 gap-4">
            <!-- First Name -->
            <div>
                <input type="text"
                       id="firstname"
                       name="firstname"
                       required
                        pattern="[A-Za-z\s]+"
                       title="Only alphabets are allowed"
                       placeholder="First Name"
                       class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm text-white">
                <span id="error-firstname" class="text-red-500 text-xs hidden"></span>
            </div>

            <!-- Last Name -->
            <div>
                <input type="text"
                       id="lastname"
                       name="lastname"
                       required
                       pattern="[A-Za-z\s]+"
                       title="Only alphabets are allowed"
                       placeholder="Last Name"
                       class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm text-white">
                <span id="error-lastname" class="text-red-500 text-xs hidden"></span>
            </div>

            <!-- Phone Number -->
            <div class="col-span-2">
                <input type="text"
                       id="phone"
                       name="phone"
                       required
                       inputmode="numeric"
                       pattern="[0-9\-]+"
                       title="Numbers and hyphens only"
                       placeholder="Phone Number (0300-1234567)"
                       maxlength="12"
                       class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm text-white">
                <span id="error-phone" class="text-red-500 text-xs hidden"></span>
            </div>

            <!-- CNIC Number -->
            <div class="col-span-2">
                <input type="text"
                       id="cnic_number"
                       name="cnic_number"
                       placeholder="CNIC (12345-1234567-1)"
                       required
                       inputmode="numeric"
                       pattern="[0-9\-]+"
                       title="Numbers and hyphens only"
                       maxlength="15"
                       class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm text-white">
                <span id="error-cnic" class="text-red-500 text-xs hidden"></span>
            </div>

            <!-- CNIC Images -->
            <div class="col-span-2 grid grid-cols-2 gap-4 pt-3 border-t border-slate-700">
                <!-- CNIC Front -->
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-slate-500 block">CNIC Front Side</label>
                    <label class="flex items-center gap-2 p-2 bg-slate-900/50 border border-slate-700 rounded-xl cursor-pointer hover:border-orange-500/50 transition-all relative">
                        <div class="bg-slate-800 p-1.5 rounded-lg shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 text-orange-500">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Z" />
                            </svg>
                        </div>
                        <span id="name-cnic-front" class="text-[9px] text-slate-400 font-medium truncate">Choose Image</span>
                        <input type="file"
                               id="cnic_front"
                               name="cnic_front"
                               accept="image/jpeg,image/jpg,image/png"
                               class="hidden">
                    </label>
                    <span id="error-cnic-front" class="text-red-500 text-xs hidden"></span>
                </div>

                <!-- CNIC Back -->
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-slate-500 block">CNIC Back Side</label>
                    <label class="flex items-center gap-2 p-2 bg-slate-900/50 border border-slate-700 rounded-xl cursor-pointer hover:border-orange-500/50 transition-all relative">
                        <div class="bg-slate-800 p-1.5 rounded-lg shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3.5 h-3.5 text-orange-500">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75-3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z" />
                            </svg>
                        </div>
                        <span id="name-cnic-back" class="text-[9px] text-slate-400 font-medium truncate">Choose Image</span>
                        <input type="file"
                               id="cnic_back"
                               name="cnic_back"
                               accept="image/jpeg,image/jpg,image/png"
                               class="hidden">
                    </label>
                    <span id="error-cnic-back" class="text-red-500 text-xs hidden"></span>
                </div>
            </div>
        </div>

        <!-- General Error Message -->
        <div id="general-error" class="text-red-500 text-xs font-bold hidden"></div>

        <button type="submit" class="w-full mt-8 bg-white py-4 rounded-xl font-bold text-black uppercase tracking-wide hover:bg-slate-100 transition-colors">
            Submit for Approval
        </button>
    </form>
</div>
