<div id="game-overlay" hx-swap-oob="true" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50">
    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 text-center max-w-sm shadow-2xl">
        <div class="text-6xl mb-4 animate-bounce">⏳</div>
        <h2 class="text-xl font-bold text-white mb-2">Verification Pending</h2>
        <p class="text-slate-400 text-sm mb-6">
            Your documents are being reviewed. Once an admin approves your account, you'll be able to play.
        </p>

        <div class="space-y-3">

            <!-- Close Modal - Completely removes the overlay -->
            <button
                onclick="document.getElementById('game-overlay').remove()"
                class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl uppercase text-xs tracking-widest transition-all">
                Close
            </button>


        </div>
    </div>
</div>
